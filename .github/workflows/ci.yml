name: Game pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify, build and package
        run: pnpm run release:yandex

      - name: Upload Yandex Games archive
        uses: actions/upload-artifact@v4
        with:
          name: fruit-10-plus-yandex
          path: artifacts/fruit-10-plus-yandex.zip
          if-no-files-found: error
