<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Фрукты 10+</title>
  <meta name="theme-color" content="#100b27" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-fruit">🍊</span><div><small>СОБЕРИ СУММУ</small><h1>Фрукты 10+</h1></div></div>
      <div class="stats"><div><small>СЧЁТ</small><strong id="score">0</strong></div><div><small>РЕКОРД</small><strong id="best">0</strong></div></div>
    </header>

    <section class="play-area">
      <div class="goal-card">
        <div class="level-chip"><small>УРОВЕНЬ</small><strong id="level">1</strong></div>
        <div class="mission-copy"><span id="mission">Набери 300 очков</span><p id="progress">0 / 300</p></div>
        <div class="moves-box"><small>ХОДЫ</small><strong id="moves">12</strong></div>
        <div class="target-token"><small>СУММА</small><strong id="target">10</strong></div>
      </div>

      <div class="board-wrap">
        <div class="combo" id="combo"></div>
        <div class="board" id="board" aria-label="Игровое поле"></div>
      </div>

      <div class="controls">
        <div class="sum-box"><span>СУММА</span><strong id="sum">0</strong><em>/ <b id="sumTarget">10</b></em></div>
        <button class="clear-btn" id="clear" type="button" aria-label="Сбросить выбор">Сбросить</button>
        <div class="danger-meter" id="dangerMeter" hidden><span>💣 ФИТИЛЬ</span><strong id="fuse">4</strong><em>хода</em></div>
      </div>
      <p class="hint" id="hint">Нажимай на любые фрукты</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <div class="game-over" id="gameOver" hidden>
    <div class="game-over-card">
      <span class="boom" id="gameOverIcon">💥</span>
      <small>ПАРТИЯ ОКОНЧЕНА</small>
      <h2 id="gameOverTitle">Фитиль догорел!</h2>
      <p id="gameOverText">Счёт за эту партию: <strong id="finalScore">0</strong></p>
      <button id="restart" type="button">Играть ещё</button>
    </div>
  </div>
  <div class="level-complete" id="levelComplete" hidden>
    <div class="level-complete-card">
      <span>🏆</span>
      <small>ЗАДАЧА ВЫПОЛНЕНА</small>
      <h2>Уровень пройден!</h2>
      <p>Осталось ходов: <strong id="movesBonus">0</strong></p>
      <button id="nextLevel" type="button">Следующий уровень</button>
    </div>
  </div>
  <script src="game.js?v=7"></script>
</body>
</html>
